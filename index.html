<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio | Python & Streamlit - CME</title>
    <!-- Stlite CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.67.0/build/stlite.css">
</head>
<body style="margin: 0; background-color: #0f172a;">

    <div id="root"></div>

    <!-- Stlite JS -->
    <script src="https://cdn.jsdelivr.net/npm/@stlite/browser@0.67.0/build/stlite.js"></script>
    <script>
        stlite.mount({
            requirements: ["streamlit", "pandas"],
            entrypoint: "app.py",
            files: {
                "app.py": `
import streamlit as st

st.set_page_config(
    page_title="Portfólio | Análise de Sistemas & Python",
    page_icon="💡",
    layout="centered"
)

# Estilização visual limpa e amigável
st.markdown(\"\"\"
    <style>
    .stApp {
        background-color: #0f172a;
        color: #f8fafc;
    }
    </style>
\"\"\", unsafe_allow_html=True)

# Cabeçalho Pessoal
st.markdown("<h1 style='text-align: center; color: white;'>Olá! Bem-vindo ao meu portfólio</h1>", unsafe_allow_html=True)
st.markdown("<p style='text-align: center; color: #94a3b8;'>Formado em Análise e Desenvolvimento de Sistemas. Uso Python e Streamlit para criar automações e sistemas práticos voltados para a rotina da CME (Central de Material e Esterilização) e do hospital.</p>", unsafe_allow_html=True)

st.divider()

# Sobre a iniciativa
st.subheader("👋 Sobre este espaço")
st.write("Embora não atue formalmente na equipe de TI, sempre gostei de colocar a mão na massa para resolver problemas reais da rotina de trabalho. Estes são alguns dos sistemas que desenvolvi por conta própria para otimizar processos internos.")

# Seção de Projetos Concluídos
st.subheader("🚀 Projetos Concluídos (Em Produção)")

with st.container(border=True):
    st.markdown("### 🏥 GAPP CME")
    st.write("Aplicação central desenvolvida para apoiar a organização, controle e os fluxos de trabalho dentro da Central de Material e Esterilização.")
    st.caption("🛠️ Python | Streamlit")
    st.link_button("🔗 Acessar Aplicação", "https://gappcccme.streamlit.app/")

with st.container(border=True):
    st.markdown("### 📋 CME Pedidos")
    st.write("Sistema voltado para agilizar o controle, registro e o gerenciamento de pedidos de materiais e insumos.")
    st.caption("🛠️ Python | Streamlit")
    st.link_button("🔗 Acessar Aplicação", "https://cmepedidos.streamlit.app/")

with st.container(border=True):
    st.markdown("### 🏢 Solicitação de Unidades")
    st.write("Interface intuitiva projetada para facilitar as solicitações de materiais vindas das diversas unidades do hospital para a CME.")
    st.caption("🛠️ Python | Streamlit")
    st.link_button("🔗 Acessar Aplicação", "https://solicitacaounidades.streamlit.app/")

with st.container(border=True):
    st.markdown("### 🏷️ Gerador ZPL")
    st.write("Ferramenta útil para geração e formatação de códigos ZPL (Zebra), facilitando a impressão de etiquetas de identificação.")
    st.caption("🛠️ Python | Streamlit")
    st.link_button("🔗 Acessar Aplicação", "https://geradorzpl.streamlit.app/")

# Seção de Projetos em Desenvolvimento
st.subheader("🚧 Projetos em Desenvolvimento")

with st.container(border=True):
    st.markdown("### 🔍 Track CME")
    st.write("Sistema focado no rastreamento e acompanhamento detalhado de itens e processos dentro da CME, aumentando o controle operacional.")
    st.caption("🛠️ Status: Em desenvolvimento ativo")
    st.link_button("🔗 Testar Versão Atual", "https://trackcme.streamlit.app/")

st.divider()

st.subheader("📚 Minha Formação & Filosofia")
st.markdown(\"\"\"
* **Graduação:** Análise e Desenvolvimento de Sistemas.
* **Abordagem:** Foco total em utilidade prática e resolução de gargalos operacionais.
\"\"\")

st.markdown("---")
st.markdown("<p style='text-align: center; color: #64748b;'>Criado com Python, Streamlit e Stlite.</p>", unsafe_allow_html=True)
                `
            }
        },
        document.getElementById("root")
    );
    </script>
</body>
</html>
