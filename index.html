      /* Função para remover o loader suavemente assim que a app carregar */
      function hideLoader() {
        const loader = document.getElementById('custom-loader');
        if (loader && loader.style.opacity !== '0') {
          loader.style.opacity = '0';
          loader.style.transition = 'opacity 0.4s ease';
          setTimeout(() => {
            if (loader) loader.style.display = 'none';
          }, 400);
        }
      }

      // Observa quando o componente '.stApp' aparece na DOM para ocultar o loader
      const observer = new MutationObserver(() => {
        if (document.querySelector('.stApp')) {
          hideLoader();
          observer.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });

      // Fallback de segurança: oculta o loader após 7 segundos caso ocorra lentidão
      setTimeout(hideLoader, 7000);

         CONFIGURAÇÃO E EXECUÇÃO DO SCRIPT PYTHON (Streamlit App)

# Cache para validar se a URL da imagem responde corretamente (Evita lentidão)
@st.cache_data(ttl=3600)
def is_valid_image(url):
    if not url:
        return False
    try:
        resp = requests.head(url, timeout=3)
        return resp.status_code == 200 and "image" in resp.headers.get("content-type", "")
    except Exception:
        return False

# Renderiza a imagem abrindo no tamanho original ao clicar, ou exibe fallback se falhar
def render_image(url):
    if is_valid_image(url):
        st.markdown(f"""
            <a href="{url}" target="_blank" class="card-img-link" title="Clique para abrir a imagem no tamanho original">
                <img src="{url}" style="width: 100%; height: 180px; object-fit: cover; object-position: top; border-radius: 8px; border: 1px solid {card_border}; display: block;" />
            </a>
        """, unsafe_allow_html=True)
        return
    
    st.markdown("""

            <span style='font-size: 1.5rem; margin-bottom: 4px;'>📷</span>
            <span>Prévia em breve</span>
        </div>
    """, unsafe_allow_html=True)
