    <!-- Stlite Mountable CSS -->

      /* Tela de Carregamento (Loader) */
      #custom-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #0f172a;
        color: #f8fafc;
        display: flex;

        justify-content: center;
        align-items: center;
        z-index: 999999;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }

      .spinner {
        width: 44px;
        height: 44px;
        border: 4px solid rgba(56, 189, 248, 0.15);
        border-left-color: #38bdf8;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        margin-bottom: 16px;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .loader-title {
        font-size: 1.2rem;
        font-weight: 600;
        color: #f8fafc;
        margin: 0 0 6px 0;
      }

      .loader-text {
        font-size: 0.85rem;
        color: #94a3b8;
        max-width: 280px;
        margin: 0;
        line-height: 1.4;
      }
    </style>
  </head>

    <!-- Tela de Carregamento Personalizada -->
    <div id="custom-loader">

      <p class="loader-text">Inicializando ambiente Python no seu navegador.</p>
    </div>

    <!-- Ponto de montagem da aplicação -->
    <div id="root"></div>

    <!-- Stlite Mountable JS -->
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.73.0/build/stlite.js"></script>

    <script>
      // Função para esconder o loader suavemente
      function hideLoader() {
        const loader = document.getElementById('custom-loader');
        if (loader && loader.style.opacity !== '0') {
          loader.style.opacity = '0';
          loader.style.transition = 'opacity 0.4s ease';
          setTimeout(() => {
            if (loader) loader.style.display = 'none';
          }, 400);
        }
      }

      // Oculta a tela de carregamento assim que o Streamlit carrega o conteúdo principal
      const observer = new MutationObserver(() => {
        if (document.querySelector('.stApp')) {
          hideLoader();
          observer.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });

      // Trava de segurança (caso demore mais de 7s)
      setTimeout(hideLoader, 7000);

      // Inicialização do Stlite
      stlite.mount({
        requirements: ["streamlit"],
        entrypoint: "app.py",
